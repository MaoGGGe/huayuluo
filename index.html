    }
    CX.restore();

    for(var d=0;d<introDust.length;d++){
      var dust=introDust[d],da=dust.a+t*.00005*dust.s,dd=reach*dust.d*(.45+progress*.65),dx=cx+Math.cos(da)*dd,dy=cy+Math.sin(da)*dd*.72;
      if(dx<-4||dx>W+4||dy<-4||dy>H+4)continue;
      CX.globalAlpha=dust.o*(.35+.65*Math.sin(t*.002+dust.p)**2);CX.fillStyle=dust.d>.72?"#efd08a":"#a8e9ff";
      CX.beginPath();CX.arc(dx,dy,dust.z,0,Math.PI*2);CX.fill()
    }

    var flowerP=easeOutCubic((elapsed-220)/Math.max(1,introDur*.72));
    for(var f=0;f<introFlowers.length;f++){
      var flower=introFlowers[f],fa=flower.a+t*.00012*(flower.rs<0?-1:1),fd=reach*flower.d*flowerP,fx=cx+Math.cos(fa)*fd,fy=cy+Math.sin(fa)*fd*.72;

    }

    CX.beginPath();CX.ellipse(cx,cy,ring*1.26,ring*.42,elapsed*.0002,0,Math.PI*2);CX.stroke();
    if(progress>.06)dNe(cx,cy,Math.max(6,Math.min(10,unit*.018)),"#5dd6ff");
    CX.globalAlpha=1;

    if(progress>=1)finishIntro()
  }

  function dFE(tp,x,y,sz,co,dk,rt,fi){
    CX.save();CX.translate(x,y);
    if(tp===0){
      CX.fillStyle=co;CX.globalAlpha=0.85;
      CX.beginPath();CX.ellipse(0,0,sz*0.4,sz*0.55,rt||0,0,Math.PI*2);CX.fill();

      CX.strokeStyle=dk;CX.globalAlpha=0.3;CX.lineWidth=0.5;

    }else if(tp===1){
      CX.save();CX.rotate(rt||0);CX.fillStyle=co;CX.globalAlpha=0.8;

    }else if(tp===2){

  function canvasPoint(clientX,clientY){

  function resetRoute(x,y,message){
    for(var i=0;i<nodes.length;i++)if(nodes[i].order>=0)nodes[i].hit=false;
    nextNode=0;trace=[{x:x,y:y}];routeMsg=message||"花阵散了，再引一次";routeMsgTi=720;
    CD.textContent=routeMsg;CD.classList.remove("sh");void CD.offsetWidth;CD.classList.add("sh")
  }

  function checkRouteNode(x,y){
    var nearest=null,nearestD=Infinity;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i],dx=x-n.x,dy=y-n.y,d=Math.sqrt(dx*dx+dy*dy);
      if(!n.hit&&d<n.r*1.15&&d<nearestD){nearest=n;nearestD=d}
    }
    if(!nearest)return;
    if(nearest.order===nextNode){
      nearest.hit=true;nextNode++;sc+=10+liIdx*2;SE.textContent=sc;
      spEx(nearest.x,nearest.y,FC[nearest.fi].l||"#f8e2a4",26);
      CD.textContent="引香 "+nextNode+"/"+nodeGoal;
      SH.textContent=nextNode<nodeGoal?"继续引香，花阵正在盛开":"花阵已成，花海正在回应";
      if(nextNode>=nodeGoal){
        drawing=false;sc+=Math.max(0,Math.ceil(lvTi/1000))*3;SE.textContent=sc;onLD()
      }
    }else{
      resetRoute(x,y,nearest.order<0?"误入幻花，香路重来":"顺序错了，香路重来")
    }
  }

  function moveRoute(clientX,clientY,active){
    if(st!=="p")return;
    var point=canvasPoint(clientX,clientY);pl.x=point.x;pl.y=point.y;
    if(!active)return;
    if(!drawing){drawing=true;trace=[point];routeStart=point;return}
    var last=trace[trace.length-1],dx=point.x-last.x,dy=point.y-last.y;
    if(dx*dx+dy*dy<9)return;
    for(var i=0;i<trace.length-2;i++){
      if(segmentsCross(trace[i],trace[i+1],last,point)){resetRoute(point.x,point.y,"香路交叠，重新引香");return}
    }
    trace.push(point);checkRouteNode(point.x,point.y)
  }

  function upd(dt){
    if(st==="p"){
      lvTi-=dt;var pct=Math.max(0,lvTi/(LT*1000));TB.style.width=(pct*100)+"%";
      if(lvTi<=0){onGO();return}
      if(routeMsgTi>0){routeMsgTi-=dt}else{CD.textContent="引香 "+nextNode+"/"+nodeGoal}
      var now=performance.now();
      for(var i=0;i<nodes.length;i++){
        var n=nodes[i];
        if(n.moving){n.x=n.bx+Math.sin(now*n.speed+n.phase)*n.amp;n.y=n.by+Math.cos(now*n.speed*.8+n.phase)*n.amp*.35}
      }
      for(var i=pa.length-1;i>=0;i--){
        var p=pa[i];p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
        if(p.l<=0)pa.splice(i,1)
      }
      for(var i=am.length-1;i>=0;i--){
        var p=am[i];p.x+=p.vx+Math.sin(now*.001+p.an)*.2;p.y+=p.vy;p.an+=p.rs;
        if(p.y>H+10){p.y=-10;p.x=Math.random()*W}
      }
    }

    if(st==="f"){
      peTi-=dt;
      if(peTi>0&&pe.length<60)spPe(2);
      for(var i=pe.length-1;i>=0;i--){
        var p=pe[i];
        p.x+=p.vx+Math.sin(p.so+performance.now()*p.sw)*0.5;
        p.y+=p.vy;p.an+=p.rs;
        if(p.y>H+20)pe.splice(i,1)
      }
      if(peTi<=0&&pe.length===0)shM()
    }
  }

  function draw(){

    var fi=LS[Math.min(liIdx,LS.length-1)].fi,fl=FC[fi];

    if(st!=="p")return;e.preventDefault();if(CV.setPointerCapture)CV.setPointerCapture(e.pointerId);hp(e.clientX,e.clientY,true)
  },{passive:false});
  CV.addEventListener("pointermove",function(e){
    if(st!=="p"||!drawing)return;e.preventDefault();hp(e.clientX,e.clientY,true)
  },{passive:false});
  CV.addEventListener("pointerup",function(e){
    if(st!=="p")return;e.preventDefault();drawing=false;routeStart=null;if(CV.releasePointerCapture)CV.releasePointerCapture(e.pointerId)
  },{passive:false});
  CV.addEventListener("pointercancel",function(){drawing=false;routeStart=null});

  IN.addEventListener("click",function(e){
    if(introSkip&&e.target!==IK)finishIntro()
  });
  IK.addEventListener("click",function(e){e.stopPropagation();if(introSkip)finishIntro()});

  AB.addEventListener("click",function(){
    var t=parseInt(AB.dataset.t,10);
    if(!isNaN(t)&&t>=0&&t<tl){
      if(st==="f"){sL(t,true)}else{OV.classList.add("hd");iL(t);loop(performance.now())}
    }else if(AB.dataset.t==="map"){shM()}
    else shMenu()
  });
  RB.addEventListener("click",function(){
    var t=parseInt(RB.dataset.t,10);
    if(!isNaN(t)){OV.classList.add("hd");iL(t);loop(performance.now())}
  });
  MB.addEventListener("click",function(){shM()});
  MM.addEventListener("click",function(){shM()});

  resizeCv();
  startIntro()
})();
</script>
