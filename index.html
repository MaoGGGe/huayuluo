<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>花灵 · 花雨落</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#101433;--bg2:#2c1a4a;--bg3:#0f2438;
  --fg:#f2ecdf;--mf:#a89cc0;--glass:rgba(255,255,255,0.075);
  --glass2:rgba(255,255,255,0.05);--stroke:rgba(255,255,255,0.14);
  --gold:#e8c87a;--gd2:#b5985c;--s2:#e3a06c;--s3:#8fbfa8;--ds:#e26d6d;
  --card:rgba(255,255,255,0.055);
}
html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--fg);
  font-family:"PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",-apple-system,"SF Pro Text",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:stretch;justify-content:center;min-height:100dvh;padding:0;
  background:
    radial-gradient(1100px 700px at 85% -10%,rgba(145,110,220,0.32),transparent 60%),
    radial-gradient(900px 600px at -10% 20%,rgba(60,130,220,0.28),transparent 55%),
    radial-gradient(800px 700px at 50% 115%,rgba(230,150,90,0.18),transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,0.06),transparent 45%),
  repeating-linear-gradient(115deg,rgba(255,255,255,0.012) 0 1px,transparent 1px 28px)}
#gr{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;
  width:100%;height:100dvh;padding:10px 12px;border-radius:0;
  background:var(--glass);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
  border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -1px 0 rgba(255,255,255,0.06)}
#gr::after{content:"";position:absolute;inset:0;border-radius:0;pointer-events:none;z-index:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent 30%,transparent 70%,rgba(255,255,255,0.06))}
#gr>*{position:relative;z-index:1}
#gr .gh{display:flex;align-items:center;gap:8px;padding:0 6px;width:100%}
#gr .hg{display:flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--stroke);
  border-radius:14px;padding:5px 10px}
#gr .hg.rh{margin-left:auto}
#gr .sl{font-size:10px;letter-spacing:2px;color:var(--mf);font-weight:500}
#gr .sv{font-size:18px;font-weight:600;color:var(--fg);min-width:28px;text-align:right;font-feature-settings:"tnum"}
#cw{position:relative;width:100%;flex:1;min-height:0;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(18,16,46,0.72),rgba(12,12,32,0.72));
  border:1px solid var(--stroke);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04),inset 0 1px 8px rgba(255,255,255,0.05)}
#tbw{width:calc(100% - 12px);height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin:0 6px}
#tb{height:100%;border-radius:2px;transition:width 0.12s linear;
  background:linear-gradient(90deg,rgba(232,160,108,0.8),var(--gold))}
#cv{display:block;width:100%;height:100%;background:transparent;outline:none;touch-action:manipulation}
#cv:focus-visible{box-shadow:inset 0 0 0 2px rgba(232,200,122,0.5)}
#gr .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
  background:rgba(14,12,38,0.42);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-radius:22px;transition:opacity 0.3s}
#gr .ov.hd{opacity:0;pointer-events:none}
#gr .oc{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px;width:88%;max-width:330px;
  background:linear-gradient(145deg,rgba(255,255,255,0.09),rgba(255,255,255,0.03));
  border:1px solid var(--stroke);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.14)}
#gr .ot{font-size:26px;font-weight:600;letter-spacing:4px;margin:0;color:var(--fg);
  background:linear-gradient(120deg,#f6e5bb,var(--gold),#d7b36a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 2px 20px rgba(232,200,122,0.12)}
#gr .os{margin:0;font-size:12.5px;color:var(--mf);line-height:1.7}
#gr .cr{font-size:10px;color:var(--gd2);letter-spacing:1.5px;opacity:0.6;text-align:center}
#gr .dv{width:54px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,200,122,0.5),transparent);margin:2px 0}
#gr .obtn{font-family:inherit;font-size:14px;font-weight:500;letter-spacing:2px;padding:10px 32px;margin-top:2px;cursor:pointer;
  border:1px solid rgba(232,200,122,0.45);border-radius:16px;background:rgba(232,200,122,0.08);color:var(--gold);
  transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  box-shadow:0 4px 16px rgba(0,0,0,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
#gr .obtn:hover{background:rgba(232,200,122,0.18);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
#gr .obtn:active{transform:scale(0.97)}
#gr .obtn.pr{background:linear-gradient(135deg,#e8c87a,#d7b36a);color:#201a2c;border-color:transparent;font-weight:600;
  box-shadow:0 6px 20px rgba(232,200,122,0.25),inset 0 1px 0 rgba(255,255,255,0.4)}
#gr .obtn.pr:hover{box-shadow:0 10px 28px rgba(232,200,122,0.35)}
#gr .bg{display:flex;gap:10px;margin-top:2px}
#gr .bg.hd{display:none}
#gr .fs{font-size:30px;font-weight:600;color:var(--gold)}
#gr .nb{font-size:10px;letter-spacing:2px;color:var(--gold);animation:pb 0.6s ease-in-out infinite alternate}
@keyframes pb{from{opacity:0.5}to{opacity:1}}
#gr .lm{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;width:100%;max-height:430px;overflow-y:auto}
#gr .lm::-webkit-scrollbar{width:0}
#gr .lp{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;padding:0 8px}
#gr .lr{display:flex;align-items:center;gap:12px;width:100%;justify-content:center}
#gr .ln{width:42px;height:42px;min-width:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.05);color:var(--mf);font-family:inherit;font-size:13px;font-weight:500;cursor:default;
  display:flex;align-items:center;justify-content:center;transition:all 0.3s;position:relative;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1)}
#gr .ln.co{border-color:rgba(232,200,122,0.55);background:rgba(232,200,122,0.12);color:var(--gold)}
#gr .ln.cu{border-color:rgba(232,200,122,0.8);background:linear-gradient(135deg,#e8c87a,#d7b36a);color:#201a2c;font-weight:600;
  box-shadow:0 0 0 3px rgba(232,200,122,0.18),0 8px 24px rgba(232,200,122,0.25);animation:np 1.5s ease-in-out infinite}
#gr .ln.un{border-color:rgba(255,255,255,0.2);color:var(--fg);cursor:pointer}
#gr .ln.un:hover{border-color:rgba(232,200,122,0.5);background:rgba(232,200,122,0.08)}
#gr .ln.lo{opacity:0.25;cursor:default}
#gr .ln .cm{position:absolute;top:-3px;right:-3px;width:15px;height:15px;background:linear-gradient(135deg,#e8c87a,#d7b36a);
  border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(232,200,122,0.3)}
#gr .ln .cm svg{width:8px;height:8px;stroke:#201a2c;stroke-width:3.5}
#gr .lc{width:2px;height:14px;background:rgba(255,255,255,0.12);margin:0 auto;flex-shrink:0}
#gr .lc.do{background:rgba(232,200,122,0.45)}
#gr .lc.pa{background:linear-gradient(to bottom,rgba(232,200,122,0.45) 50%,rgba(255,255,255,0.12) 50%)}
@keyframes np{0%,100%{box-shadow:0 0 0 3px rgba(232,200,122,0.18),0 8px 24px rgba(232,200,122,0.25)}50%{box-shadow:0 0 0 6px rgba(232,200,122,0.12),0 14px 34px rgba(232,200,122,0.18)}}
#gr .lii{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:4;
  border-radius:22px;opacity:0;transition:opacity 0.45s;pointer-events:none;background:rgba(14,12,38,0.55);
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%)}
#gr .lii.sh{opacity:1}
#gr .lii .ll{font-size:12px;letter-spacing:5px;color:var(--mf)}
#gr .lii .lnum{font-size:56px;font-weight:600;color:var(--fg);letter-spacing:2px;
  background:linear-gradient(120deg,#f6e5bb,var(--gold),#d7b36a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 24px rgba(232,200,122,0.2))}
#gr .lii .lf{font-size:16px;font-weight:500;letter-spacing:3px;color:var(--fg)}
#gr .lii .lpo{font-size:12px;color:var(--gd2);letter-spacing:2px;opacity:0.85}
#gr .sk{position:absolute;bottom:14px;right:14px;z-index:8;font-family:inherit;font-size:11px;letter-spacing:2px;padding:6px 14px;
  border:1px solid rgba(255,255,255,0.22);border-radius:12px;background:rgba(255,255,255,0.09);color:var(--fg);cursor:pointer;
  opacity:0;transition:opacity 0.3s;touch-action:manipulation;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#gr .sk.sh{opacity:1}
#gr .cd{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;font-size:14px;font-weight:600;letter-spacing:3px;
  color:var(--gold);opacity:0;transition:opacity 0.3s;pointer-events:none;text-shadow:0 2px 16px rgba(232,200,122,0.4)}
#gr .cd.sh{opacity:1}
#gr .shh{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;font-size:10px;letter-spacing:2px;
  color:var(--gold);opacity:0;transition:opacity 0.3s;pointer-events:none;text-shadow:0 2px 12px rgba(232,200,122,0.35)}
#gr .shh.sh{opacity:1}
@media(max-width:440px){#gr{padding:8px 10px;gap:6px}#gr .oc{padding:14px;gap:8px;border-radius:18px}#gr .ot{font-size:22px}#gr .sv{font-size:15px;min-width:26px}#gr .sl{font-size:9px}#gr .hg{padding:4px 8px;border-radius:12px}#gr .ln{width:36px;height:36px;min-width:36px;font-size:12px}#gr .lc{height:11px}#gr .lm{max-height:70dvh}#gr .lii .lnum{font-size:44px}}
@media(max-width:360px){#gr .ot{font-size:19px}#gr .obtn{font-size:13px;padding:8px 22px}#gr .ln{width:31px;height:31px;min-width:31px;font-size:11px}#gr .lii .lnum{font-size:36px}}
</style>
</head>
<body>
<div id="gr">
  <div class="gh">
    <span class="hg"><span class="sl">花蜜</span><span id="se" class="sv">0</span></span>
    <span class="hg"><span class="sl">花境</span><span id="ld" class="sv">1</span></span>
    <span class="hg rh"><span class="sl">最高</span><span id="be" class="sv">0</span></span>
  </div>
  <div id="tbw"><div id="tb" style="width:100%"></div></div>
  <div id="cw">
    <canvas id="cv" width="400" height="500" tabindex="0"></canvas>
    <div id="cd" class="cd"></div>
    <div id="shh" class="shh">✦ 点击发动花盾 ✦</div>
    <div id="ov" class="ov">
      <div class="oc">
        <div class="dv"></div>
        <h2 id="ot" class="ot">花灵 · 花雨落</h2>
        <div class="dv"></div>
        <p id="os" class="os">采集花蜜，躲避花敌<br>十大花境，步步惊心</p>
        <button id="ab" class="obtn pr">开始闯关</button>
        <div id="bg" class="bg hd">
          <button id="rb" class="obtn pr">重试本关</button>
          <button id="mb" class="obtn">闯关地图</button>
        </div>
      </div>
    </div>
    <div id="lii" class="lii">
      <div class="ll">第 <span id="lnum" class="lnum">一</span> 花境</div>
      <div id="lf" class="lf"></div>
      <div id="lpo" class="lpo"></div>
    </div>
    <button id="sk" class="sk">跳过 »</button>
  </div>
  <p class="cr">由 YanYue 赠 M1 Pro 所制</p>
</div>
<script>
(function(){
  var R=document.getElementById("gr"),CV=document.getElementById("cv"),CX=CV.getContext("2d");
  var OV=document.getElementById("ov"),OT=document.getElementById("ot"),OS=document.getElementById("os");
  var AB=document.getElementById("ab"),RB=document.getElementById("rb"),MB=document.getElementById("mb");
  var BG=document.getElementById("bg"),SE=document.getElementById("se"),BE=document.getElementById("be");
  var LD=document.getElementById("ld"),TB=document.getElementById("tb");
  var LI=document.getElementById("lii"),LN=document.getElementById("lnum"),LF=document.getElementById("lf");
  var LP=document.getElementById("lpo"),SK=document.getElementById("sk");
  var CD=document.getElementById("cd"),SH=document.getElementById("shh");

  var W=400,H=500,PS=11,LT=15,PD=4000,CW_EL=document.getElementById("cw"),DPR=window.devicePixelRatio||1;
  var LV=["一","二","三","四","五","六","七","八","九","十"];
  var PO=["雪落无声，暗香浮动","落英缤纷，刹那芳华","凌寒独放，傲骨铮铮","人面桃花，相映成红","紫雾弥漫，幽香满怀","心向骄阳，灿烂如初","出淤不染，濯涟不妖","金粟满枝，十里飘香","待到秋来，我花开后","带刺柔情，红颜如血"];
  var FC=[
    {n:"茉莉花",c:"#f5ece0",k:"#e8d4a0",l:"#fff8f0",d:"#d4c4a0"},
    {n:"樱花",c:"#ffb7c5",k:"#ff8fa3",l:"#ffe0e8",d:"#e88a9a"},
    {n:"梅花",c:"#e63946",k:"#c1121f",l:"#ff8a95",d:"#a01018"},
    {n:"桃花",c:"#ffc8dd",k:"#ffafcc",l:"#ffe8f0",d:"#e898b0"},
    {n:"薰衣草",c:"#b39ddb",k:"#7c4dff",l:"#d1c4e9",d:"#8a6ab8"},
    {n:"向日葵",c:"#ffd54f",k:"#5d4037",l:"#fff176",d:"#b8860b"},
    {n:"荷花",c:"#f8bbd0",k:"#f06292",l:"#fce4ec",d:"#d81b60"},
    {n:"桂花",c:"#ffe082",k:"#ff8f00",l:"#ffecb3",d:"#e6a800"},
    {n:"菊花",c:"#ce93d8",k:"#8e24aa",l:"#e1bee7",d:"#6a1b9a"},
    {n:"玫瑰花",c:"#e91e63",k:"#880e4f",l:"#f48fb1",d:"#c2185b"}
  ];
  var LS=[
    {sp:0.7,iv:950,fi:0},{sp:0.9,iv:880,fi:1},{sp:1.1,iv:820,fi:2},{sp:1.3,iv:760,fi:3},
    {sp:1.6,iv:700,fi:4},{sp:1.9,iv:640,fi:5},{sp:2.2,iv:580,fi:6},{sp:2.6,iv:520,fi:7},
    {sp:3.0,iv:460,fi:8},{sp:3.5,iv:400,fi:9}
  ];
  var pl,en,pa,pe,sc,st,aid,si,di,lvTi,liIdx,ke={},tl=LS.length,cl=[],peTi=0,neTi=0,am=[];
  var caSh=false,shAc=false,shTi=0,co=0,coTi=0,coTo=3000,nc=0,skSh=false;
  var cb=parseInt(localStorage.getItem("ddB")||"0",10);
  var sp=(localStorage.getItem("ddP")||"").split(",").filter(Boolean).map(Number);
  cl=sp;BE.textContent=cb;

  function resizeCv(){
  var r=CW_EL.getBoundingClientRect();
  W=Math.max(200,Math.round(r.width));
  H=Math.max(200,Math.round(r.height));
  DPR=window.devicePixelRatio||1;
  CV.width=Math.round(W*DPR);
  CV.height=Math.round(H*DPR);
  CX.setTransform(DPR,0,0,DPR,0,0);
  if(pl){
    pl.x=Math.max(pl.r,Math.min(W-pl.r,pl.x));
    pl.y=H-52;
  }
}
window.addEventListener("resize",function(){resizeCv()});
window.addEventListener("orientationchange",function(){setTimeout(resizeCv,200)});

  function gc(){
    var s=getComputedStyle(R);
    return{f:m.getPropertyValue?0:0};
  }

  // Simpler color getter - use CSS vars when available
  function gc2(){
    var s=getComputedStyle(R);
    return{
      mf:s.getPropertyValue("--mf").trim()||"#a89cc0",
      cd:"#141228",
      gd:s.getPropertyValue("--gold").trim()||"#e8c87a",
      bd:"rgba(255,255,255,0.12)",
      ds:s.getPropertyValue("--ds").trim()||"#e26d6d"
    };
  }

  function sav(){localStorage.setItem("ddP",cl.join(","))}

  // Flower drawing helpers
  function d5(cx,cy,r,co,rt,cc,al){
    CX.save();CX.translate(cx,cy);CX.rotate(rt||0);CX.globalAlpha=al||0.85;
    for(var i=0;i<5;i++){
      var a=i/5*Math.PI*2;CX.save();CX.rotate(a);
      CX.fillStyle=co;CX.beginPath();CX.ellipse(0,-r*0.6,r*0.3,r*0.55,0,0,Math.PI*2);CX.fill();CX.restore()
    }
    if(cc){CX.globalAlpha=0.9;CX.fillStyle=cc;CX.beginPath();CX.arc(0,0,r*0.15,0,Math.PI*2);CX.fill()}
    CX.restore()
  }

  function dch(cx,cy,r,co,rt,cc,al){
    CX.save();CX.translate(cx,cy);CX.rotate(rt||0);CX.globalAlpha=al||0.85;
    for(var i=0;i<5;i++){
      var a=i/5*Math.PI*2;CX.save();CX.rotate(a);
      CX.fillStyle=co;CX.beginPath();
      CX.moveTo(0,-r*0.05);
      CX.quadraticCurveTo(r*0.3,-r*0.35,r*0.25,-r*0.7);
      CX.quadraticCurveTo(0,-r*0.85,-r*0.25,-r*0.7);
      CX.quadraticCurveTo(-r*0.3,-r*0.35,0,-r*0.05);
      CX.closePath();CX.fill();CX.restore()
    }
    if(cc){CX.globalAlpha=0.9;CX.fillStyle=cc;CX.beginPath();CX.arc(0,0,r*0.15,0,Math.PI*2);CX.fill()}
    CX.restore()
  }

  function dsu(cx,cy,r,co,rt,cc,al){
    CX.save();CX.translate(cx,cy);CX.rotate(rt||0);CX.globalAlpha=al||0.85;
    for(var i=0;i<16;i++){
      var a=i/16*Math.PI*2;CX.save();CX.rotate(a);
      CX.fillStyle=co;CX.beginPath();CX.ellipse(0,-r*0.55,r*0.08,r*0.5,0,0,Math.PI*2);CX.fill();CX.restore()
    }
    if(cc){CX.globalAlpha=0.85;CX.fillStyle=cc;CX.beginPath();CX.arc(0,0,r*0.35,0,Math.PI*2);CX.fill();
      CX.globalAlpha=0.3;CX.fillStyle="#ffd54f";CX.beginPath();CX.arc(0,0,r*0.25,0,Math.PI*2);CX.fill()}
    CX.restore()
  }

  function d6(cx,cy,r,co,rt,cc,al){
    CX.save();CX.translate(cx,cy);CX.rotate(rt||0);CX.globalAlpha=al||0.8;
    for(var i=0;i<6;i++){
      var a=i/6*Math.PI*2;CX.save();CX.rotate(a);
      CX.fillStyle=co;CX.beginPath();CX.ellipse(0,-r*0.55,r*0.2,r*0.5,0,0,Math.PI*2);CX.fill();CX.restore()
    }
    if(cc){CX.globalAlpha=0.9;CX.fillStyle=cc;CX.beginPath();CX.arc(0,0,r*0.2,0,Math.PI*2);CX.fill()}
    CX.restore()
  }

  function d8(cx,cy,r,co,rt,cc,al){
    CX.save();CX.translate(cx,cy);CX.rotate(rt||0);CX.globalAlpha=al||0.8;
    for(var i=0;i<8;i++){
      var a=i/8*Math.PI*2;CX.save();CX.rotate(a);
      CX.fillStyle=co;CX.beginPath();CX.ellipse(0,-r*0.5,r*0.25,r*0.45,0,0,Math.PI*2);CX.fill();CX.restore()
    }
    if(cc){CX.globalAlpha=0.9;CX.fillStyle=cc;CX.beginPath();CX.arc(0,0,r*0.18,0,Math.PI*2);CX.fill()}
    CX.restore()
  }

  function dBF(cx,cy,sz,fi,rt,al){
    var f=FC[fi];
    if(fi===0)d5(cx,cy,sz,f.c,rt,f.k,al);
    else if(fi===1)dch(cx,cy,sz,f.c,rt,f.k,al);
    else if(fi===5)dsu(cx,cy,sz,f.c,rt,f.d,al);
    else if(fi===4||fi===8)d6(cx,cy,sz,f.c,rt,f.k,al);
    else if(fi===6)d8(cx,cy,sz,f.c,rt,f.k,al);
    else d5(cx,cy,sz,f.c,rt,f.k,al)
  }

  function dFE(tp,x,y,sz,co,dk,rt,fi){
    CX.save();CX.translate(x,y);
    if(tp===0){
      CX.fillStyle=co;CX.globalAlpha=0.85;
      CX.beginPath();CX.ellipse(0,0,sz*0.4,sz*0.55,rt||0,0,Math.PI*2);CX.fill();
      CX.fillStyle=dk;CX.globalAlpha=0.5;
      CX.beginPath();CX.moveTo(-sz*0.15,sz*0.35);CX.quadraticCurveTo(0,sz*0.7,sz*0.15,sz*0.35);CX.fill();
      CX.strokeStyle=dk;CX.globalAlpha=0.3;CX.lineWidth=0.5;
      CX.beginPath();CX.moveTo(0,sz*0.5);CX.lineTo(0,sz*0.85);CX.stroke()
    }else if(tp===1){
      CX.save();CX.rotate(rt||0);CX.fillStyle=co;CX.globalAlpha=0.8;
      CX.beginPath();CX.moveTo(0,-sz*0.05);
      CX.quadraticCurveTo(sz*0.3,-sz*0.3,sz*0.25,-sz*0.65);
      CX.quadraticCurveTo(0,-sz*0.85,-sz*0.25,-sz*0.65);
      CX.quadraticCurveTo(-sz*0.3,-sz*0.3,0,-sz*0.05);
      CX.closePath();CX.fill();
      CX.strokeStyle=dk;CX.globalAlpha=0.2;CX.lineWidth=0.5;
      CX.beginPath();CX.moveTo(0,-sz*0.1);CX.lineTo(0,-sz*0.75);CX.stroke();CX.restore()
    }else if(tp===2){
      CX.fillStyle=co;CX.globalAlpha=0.7;CX.beginPath();CX.arc(0,0,sz*0.35,0,Math.PI*2);CX.fill();
      CX.fillStyle=dk;CX.globalAlpha=0.4;
      for(var i=0;i<8;i++){
        var a=i/8*Math.PI*2;
        CX.beginPath();CX.arc(Math.cos(a)*sz*0.2,Math.sin(a)*sz*0.2,sz*0.08,0,Math.PI*2);CX.fill()
      }
    }else if(tp===3){
      CX.save();CX.rotate(rt||0);CX.fillStyle=co;CX.globalAlpha=0.85;
      CX.beginPath();CX.moveTo(0,-sz*0.8);CX.lineTo(-sz*0.1,sz*0.1);CX.lineTo(sz*0.1,sz*0.1);CX.closePath();CX.fill();
      CX.fillStyle=dk;CX.globalAlpha=0.4;
      CX.beginPath();CX.moveTo(0,-sz*0.65);CX.lineTo(-sz*0.05,sz*0.05);CX.lineTo(sz*0.05,sz*0.05);CX.closePath();CX.fill();CX.restore()
    }else if(tp===4){
      d5(0,0,sz*0.4,co,rt,dk,0.75)
    }
    CX.restore()
  }

  function dNe(x,y,sz,co){
    CX.save();CX.translate(x,y);
    var t=performance.now()*0.008+y*0.01;
    var pulse=0.7+Math.sin(t)*0.3;
    var glow=CX.createRadialGradient(0,0,0,0,0,sz*3.2);
    glow.addColorStop(0,"rgba(80,220,255,"+(0.55*pulse)+")");
    glow.addColorStop(0.5,"rgba(80,220,255,0.14)");
    glow.addColorStop(1,"rgba(80,220,255,0)");
    CX.fillStyle=glow;CX.globalAlpha=1;
    CX.beginPath();CX.arc(0,0,sz*3.2,0,Math.PI*2);CX.fill();
    CX.strokeStyle="rgba(160,245,255,"+(0.4+0.4*pulse)+")";
    CX.lineWidth=1.6;
    CX.beginPath();CX.arc(0,0,sz*1.35,0,Math.PI*2);CX.stroke();
    var g=CX.createRadialGradient(-sz*0.08,-sz*0.1,0,0,0,sz);
    g.addColorStop(0,"#d6fbff");g.addColorStop(0.5,"#5dd6ff");g.addColorStop(1,"#1d7fff");
    CX.fillStyle=g;CX.globalAlpha=1;
    CX.beginPath();CX.arc(0,0,sz*0.75,0,Math.PI*2);CX.fill();
    CX.fillStyle="#fff";CX.globalAlpha=0.9;
    CX.beginPath();CX.arc(-sz*0.12,-sz*0.12,sz*0.26,0,Math.PI*2);CX.fill();
    CX.restore()
  }

  function iL(idx){
    liIdx=idx;
    PS=Math.max(8,Math.min(14,W/42));
    pl={x:W/2,y:H-52,r:PS};
    en=[];pa=[];pe=[];am=[];

    co=0;coTi=0;nc=0;caSh=false;shAc=false;shTi=0;skSh=false;

  }

  function spAm(){
    var fi=LS[Math.min(liIdx,LS.length-1)].fi,co=FC[fi].c;

      am.push({x:Math.random()*W,y:Math.random()*H,sz:2+Math.random()*3,an:Math.random()*Math.PI*2,rs:(Math.random()-0.5)*0.02,vx:(Math.random()-0.5)*0.15,vy:0.1+Math.random()*0.2,co:co,al:0.08+Math.random()*0.08})
    }
  }

  function spE(){
    var l=LS[Math.min(liIdx,LS.length-1)],f=FC[l.fi];
    var sz=12+Math.random()*12,x=Math.random()*(W-sz*2)+sz,spd=l.sp+Math.random()*l.sp*0.6+sc*0.002;
    var tp=Math.floor(Math.random()*5);

    if(tp===1){e.wb=Math.random()*0.015;e.wo=Math.random()*Math.PI*2}
    if(tp===2){e.vx=(Math.random()-0.5)*2.5;e.vy=spd}
    if(tp===3){var d=Math.random()>0.5?1:-1;e.vx=d*(1+Math.random()*0.8);e.vy=spd*0.7}
    if(tp===4){e.vy=spd*0.5}

  }

  function spN(){
    var x=20+Math.random()*(W-40),sz=8+Math.random()*4;
    pa.push({x:x,y:-10,sz:sz,vy:0.45+Math.random()*0.35,vx:(Math.random()-0.5)*0.3,co:"#5dd6ff",ty:"n",bob:Math.random()*Math.PI*2})
  }

  function spEx(x,y,co,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,s=1+Math.random()*3;
      pa.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:0.02+Math.random()*0.03,sz:2+Math.random()*3,co:co,ty:"x"})
    }
  }

  function spPe(n){
    var fi=LS[Math.min(liIdx,LS.length-1)].fi;
    for(var i=0;i<n;i++){
      pe.push({x:Math.random()*(W+40)-20,y:Math.random()*H*-0.3-10,sz:8+Math.random()*12,fi:fi,an:Math.random()*Math.PI*2,rs:(Math.random()-0.5)*0.04,vx:(Math.random()-0.5)*0.5,vy:0.3+Math.random()*0.6,sw:Math.random()*0.02,so:Math.random()*Math.PI*2,al:0.5+Math.random()*0.5})
    }
  }

  function upd(dt){
    if(st==="p"){
      var dx=0;
      if(ke["ArrowLeft"]||ke["KeyA"])dx=-1;
      if(ke["ArrowRight"]||ke["KeyD"])dx=1;
      pl.x+=dx*300*(dt/1000);
      pl.x=Math.max(pl.r,Math.min(W-pl.r,pl.x));
      if(caSh&&!shAc&&(ke["Space"]||ke["Enter"]||ke["KeyS"])){acSh()}

      lvTi-=dt;var pct=Math.max(0,lvTi/(LT*1000));TB.style.width=(pct*100)+"%";
      if(lvTi<=0){sc=Math.max(sc,1);SE.textContent=sc;onLD();return}
      di+=dt;if(di>1000){sc++;SE.textContent=sc;di=0}
      if(co>0){coTi+=dt;if(coTi>coTo){co=0;CD.classList.remove("sh")}}

      var l=LS[Math.min(liIdx,LS.length-1)];si+=dt;
      if(si>=l.iv){var n=Math.floor(si/l.iv);for(var i=0;i<n&&i<4;i++)spE();si=si%l.iv}
      neTi+=dt;if(neTi>1500+Math.random()*1200){spN();neTi=0}
      if(shAc){shTi-=dt;if(shTi<=0){shAc=false;caSh=false;SH.classList.remove("sh")}}

      for(var i=en.length-1;i>=0;i--){
        var e=en[i];
        if(e.tp===0){e.y+=e.sp;e.rt+=e.rs}
        else if(e.tp===1){e.y+=e.sp*0.8;e.x+=Math.sin(e.wo+performance.now()*e.wb)*1.2;e.rt+=e.rs}
        else if(e.tp===2){e.x+=e.vx;e.y+=e.vy;if(e.x<0||e.x>W)e.vx=-e.vx;e.rt+=e.rs}
        else if(e.tp===3){e.x+=e.vx;e.y+=e.vy;e.rt+=e.rs*2}
        else if(e.tp===4){e.y+=e.vy;var d=pl.x-e.x;if(Math.abs(d)>5)e.x+=Math.sign(d)*e.sp*0.15;e.rt+=e.rs}
        if(shAc)continue;
        var cx2=Math.max(e.x-e.sz*0.4,Math.min(pl.x,e.x+e.sz*0.4));
        var cy2=Math.max(e.y-e.sz*0.5,Math.min(pl.y,e.y+e.sz*0.5));
        var dx2=pl.x-cx2,dy2=pl.y-cy2;
        if(dx2*dx2+dy2*dy2<pl.r*pl.r){spEx(pl.x,pl.y,"#e26d6d",20);onGO();return}
        if(e.y>H+e.sz)en.splice(i,1)
      }

      for(var i=pa.length-1;i>=0;i--){
        var p=pa[i];
        if(p.ty==="n"){
          p.x+=p.vx+Math.sin(performance.now()*0.004+p.bob)*0.5;
          p.y+=p.vy;
          var dx2=pl.x-p.x,dy2=pl.y-p.y;
          if(dx2*dx2+dy2*dy2<(pl.r+p.sz*0.75)*(pl.r+p.sz*0.75)){colN(p);pa.splice(i,1);continue}
        }else{
          p.x+=p.vx;p.y+=p.vy;p.l-=p.d;if(p.l<=0)pa.splice(i,1)
        }
      }

      for(var i=am.length-1;i>=0;i--){
        var p=am[i];
        p.x+=p.vx+Math.sin(performance.now()*0.001+p.an)*0.2;
        p.y+=p.vy;p.an+=p.rs;
        if(p.y>H+10){p.y=-10;p.x=Math.random()*W}
      }
    }

    if(st==="f"){
      peTi-=dt;
      if(peTi>0&&pe.length<60)spPe(2);
      for(var i=pe.length-1;i>=0;i--){
        var p=pe[i];
        p.x+=p.vx+Math.sin(p.so+performance.now()*p.sw)*0.5;
        p.y+=p.vy;p.an+=p.rs;
        if(p.y>H+20)pe.splice(i,1)
      }
      if(peTi<=0&&pe.length===0)shM()
    }
  }

  function draw(){
    var c=gc2();
    CX.clearRect(0,0,W,H);

    // Background tint per flower
    var fi=LS[Math.min(liIdx,LS.length-1)].fi,fl=FC[fi];
    CX.fillStyle=fl.c;CX.globalAlpha=0.02;CX.fillRect(0,0,W,H);CX.globalAlpha=1;

    // Ambient petals
    for(var i=0;i<am.length;i++){
      var p=am[i];
      CX.globalAlpha=p.al;CX.fillStyle=p.co;
      CX.save();CX.translate(p.x,p.y);CX.rotate(p.an);
      CX.beginPath();CX.ellipse(0,-p.sz*0.5,p.sz*0.3,p.sz*0.5,0,0,Math.PI*2);CX.fill();CX.restore()
    }

    // Enemies
    CX.globalAlpha=1;
    for(var i=0;i<en.length;i++){
      var e=en[i];
      dFE(e.tp,e.x,e.y,e.sz,e.co,e.dk,e.rt,e.fi)
    }

    // Nectar + particles
    for(var i=0;i<pa.length;i++){
      var p=pa[i];
      if(p.ty==="n"){dNe(p.x,p.y,p.sz,p.co||"#5dd6ff")}
      else{CX.globalAlpha=p.l;CX.fillStyle=p.co;CX.beginPath();CX.arc(p.x,p.y,p.sz*p.l,0,Math.PI*2);CX.fill()}
    }

    // Shield ring
    if(shAc){
      var t=performance.now()*0.005,lc=fl.l||c.gd;
      for(var i=0;i<8;i++){
        var a=i/8*Math.PI*2+t,r2=pl.r+6+Math.sin(t*3+i)*2;
        CX.globalAlpha=0.4+Math.sin(t+i)*0.2;CX.strokeStyle=lc;CX.lineWidth=1.5;
        CX.beginPath();CX.arc(pl.x,pl.y,r2,a,a+0.4);CX.stroke()
      }
      CX.globalAlpha=0.08;CX.fillStyle=lc;
      CX.beginPath();CX.arc(pl.x,pl.y,pl.r+14,0,Math.PI*2);CX.fill()
    }

    // Player glow + body
    var px=pl.x,py=pl.y,pr=pl.r;
    var grd=CX.createRadialGradient(px,py,0,px,py,pr*3);
    grd.addColorStop(0,"rgba(232,200,122,0.14)");grd.addColorStop(1,"transparent");
    CX.fillStyle=grd;CX.beginPath();CX.arc(px,py,pr*3,0,Math.PI*2);CX.fill();
    CX.fillStyle=fl.l||c.gd;CX.globalAlpha=0.9;
    CX.beginPath();CX.arc(px,py,pr,0,Math.PI*2);CX.fill();
    CX.fillStyle="#141228";CX.globalAlpha=0.25;
    CX.beginPath();CX.arc(px-pr*0.2,py-pr*0.2,pr*0.35,0,Math.PI*2);CX.fill();

    // Wings
    var wt=performance.now()*0.003;
    CX.globalAlpha=0.2;CX.fillStyle=fl.l||c.gd;
    CX.save();CX.translate(px-pr*0.5,py);CX.scale(1,0.6+Math.sin(wt)*0.3);
    CX.beginPath();CX.ellipse(0,0,pr*0.6,pr*0.5,0,0,Math.PI*2);CX.fill();CX.restore();
    CX.save();CX.translate(px+pr*0.5,py);CX.scale(1,0.6+Math.sin(wt+Math.PI)*0.3);
    CX.beginPath();CX.ellipse(0,0,pr*0.6,pr*0.5,0,0,Math.PI*2);CX.fill();CX.restore();

    // Flower meter
    CX.globalAlpha=0.4;CX.fillStyle=c.bd;CX.fillRect(14,H-18,96,6);
    CX.globalAlpha=0.8;CX.fillStyle=fl.l||c.gd;
    var fw=Math.min(nc,3)/3*96;
    if(fw>0)CX.fillRect(14,H-18,fw,6);
    CX.globalAlpha=0.3;CX.strokeStyle=c.bd;CX.lineWidth=0.5;
    for(var i=1;i<=2;i++){
      CX.beginPath();CX.moveTo(14+i*32,H-18);CX.lineTo(14+i*32,H-12);CX.stroke()
    }
    CX.globalAlpha=0.6;CX.fillStyle=c.mf;CX.font="9px sans-serif";
    CX.textAlign="left";CX.textBaseline="top";CX.fillText("花灵",14,H-26);

    // Charged indicator
    if(caSh&&!shAc){
      CX.globalAlpha=0.6+Math.sin(performance.now()*0.006)*0.3;
      CX.strokeStyle=fl.l||c.gd;CX.lineWidth=1.5;
      CX.beginPath();CX.arc(px,py,pr+8,0,Math.PI*2);CX.stroke()
    }

    // Combo
    CX.globalAlpha=1;CX.fillStyle=c.mf;CX.font="10px sans-serif";
    CX.textAlign="right";CX.textBaseline="bottom";
    if(co>=2)CX.fillText("×"+co,W-14,H-14)
  }
